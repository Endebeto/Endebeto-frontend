# prebuild writes public/_redirects (API proxy when SPA_PROXY_API_ORIGIN or NETLIFY_API_ORIGIN is set).
# Do not commit public/_redirects.

[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"
  # Vite 8 needs Node >= 20.19 / 22.12; Vitest 5 needs >= 22.12.
  NODE_VERSION = "22"

# Synthetic HTML + Open Graph for link-preview crawlers (see netlify/edge-functions/experience-link-preview.ts).
# Path is declared once here only (avoid duplicating export const config in the function body).
[[edge_functions]]
  path = "/experiences/*"
  function = "experience-link-preview"

# P2-18: security headers. CSP is report-only until verified on staging;
# then rename the key to Content-Security-Policy (keep vercel.json in sync).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://api.cloudinary.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://staticmap.openstreetmap.de https://randomuser.me; connect-src 'self' https://*.onrender.com https://nominatim.openstreetmap.org; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.chapa.co; object-src 'none'"
